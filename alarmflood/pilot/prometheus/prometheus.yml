global:
  scrape_interval: 5s          # 高频抓取，让告警洪水密度更接近真实企业
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: svc
    static_configs:
      - targets:
          - "svc-db:8000"
          - "svc-api-1:8000"
          - "svc-api-2:8000"
          - "svc-api-3:8000"
